name: Запрос на пересмотр рейтинга
description: Запросить проверку фактической ошибки в позиции компании в недельном рейтинге.
title: "[Пересмотр рейтинга] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Используйте эту форму только в том случае, если вы считаете, что в опубликованном рейтинге или в его доказательной базе есть фактическая ошибка.
        
        Эта форма не предназначена для простого несогласия по мнению.
  - type: input
    id: company
    attributes:
      label: Компания или бренд
      description: О какой компании идет речь?
      placeholder: Название компании
    validations:
      required: true
  - type: input
    id: ranking
    attributes:
      label: Публикация рейтинга
      description: Укажите неделю рейтинга или название публикации.
      placeholder: Рейтинг недели YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Что кажется фактически неверным
      description: Опишите конкретный факт, который нужно проверить.
      placeholder: Укажите точный пункт, сигнал оценки или публичное утверждение, которое выглядит неверным.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Публичные подтверждения
      description: Приложите публичные источники, которые подтверждают необходимость пересмотра.
      placeholder: Ссылки на источники, документы, статьи или официальные заявления.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Какая корректировка ожидается
      description: Объясните, какую корректировку вы считаете обоснованной.
      placeholder: Опишите, что именно, по вашему мнению, должно быть исправлено.
    validations:
      required: true
